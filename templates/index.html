<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
        }
        #chat-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        #chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .user-message {
            justify-content: flex-end;
        }
        .chat-message img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            max-height: 200px;
        }
        .message {
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        .user .message {
            background: #007bff;
            color: #fff;
            align-self: flex-end;
        }
        .bot .message {
            background: #f1f1f1;
            color: #333;
        }
        #input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fff;
        }
        #userInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            margin-left: 10px;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-container">
            <input type="text" id="userInput" placeholder="Enter your prompt..." onkeypress="handleKeyPress(event)" />
            <button onclick="generateImage()">Send</button>
        </div>
    </div>

    <img id="generated-image" style="display:none;" alt="Generated Image" />

    <script>
        async function generateImage() {
            const prompt = document.getElementById("userInput").value;
            if (!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            // Add user message to chat
            addMessageToChat(prompt, "user");

            // Clear input field
            document.getElementById("userInput").value = "";

            // Add loading indicator
            const loadingId = addLoadingIndicator();

            try {
                // Call the API
                const response = await fetch("/api/v1/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                
                // Remove loading indicator
                removeLoadingIndicator(loadingId);

                if (data.status === "success") {
                    // Check if we have a base64 image or a URL
                    if (data.image_url.startsWith("data:image")) {
                        // It's a base64 encoded image
                        addImageToChat(data.image_url, "bot");
                    } else {
                        // It's a URL to an image file
                        addImageToChat("/" + data.image_url, "bot");
                    }
                } else {
                    addMessageToChat("Failed to generate image. Please try again.", "bot");
                }
            } catch (error) {
                // Remove loading indicator
                removeLoadingIndicator(loadingId);
                addMessageToChat("Error: " + error.message, "bot");
            }
        }

        async function generateImage(prompt) {
            const response = await fetch("/api/v1/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt })
            });

            const data = await response.json();
            if (data.status === "success") {
                const imageElement = document.getElementById("generated-image");
                imageElement.src = data.image_url; // Set the image URL
                imageElement.style.display = "block"; // Ensure the image is visible
            } else {
                alert("Image generation failed: " + data.message);
            }
        }

        function addMessageToChat(message, sender) {
            const chatBox = document.getElementById("chat-box");
            const messageDiv = document.createElement("div");
            messageDiv.className = `chat-message ${sender}`;
            messageDiv.innerHTML = `<div class="message">${message}</div>`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the bottom
            return messageDiv;
        }

        function addLoadingIndicator() {
            const chatBox = document.getElementById("chat-box");
            const messageDiv = document.createElement("div");
            messageDiv.className = "chat-message bot";
            messageDiv.id = "loading-" + Date.now();
            messageDiv.innerHTML = '<div class="message"><div class="loading"></div> Generating image...</div>';
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv.id;
        }

        function removeLoadingIndicator(id) {
            const loadingElement = document.getElementById(id);
            if (loadingElement) {
                loadingElement.remove();
            }
        }

        function addImageToChat(imageSrc, sender) {
            const chatBox = document.getElementById("chat-box");
            const messageDiv = document.createElement("div");
            messageDiv.className = `chat-message ${sender}`;
            messageDiv.innerHTML = `<img src="${imageSrc}" alt="Generated image" />`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the bottom
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                generateImage();
            }
        }
    </script>
</body>
</html>
